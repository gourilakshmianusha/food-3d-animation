<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="75%" r="75%">
      <stop offset="0%" stop-color="#713f12" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#19130d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="motifGlow" cx="80%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a6704"/>
    </linearGradient>
    <linearGradient id="fireGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#08090b"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#motifGlow)"/>

  <!-- Ornate Border Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <rect x="44" y="44" width="1112" height="542" rx="12" fill="none" stroke="#d4af37" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Corner Flourishes -->
  <path d="M 36 60 L 60 36 M 36 36 L 50 36 M 36 36 L 36 50" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1164 60 L 1140 36 M 1164 36 L 1150 36 M 1164 36 L 1164 50" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 570 L 60 594 M 36 594 L 50 594 M 36 594 L 36 580" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1164 570 L 1140 594 M 1164 594 L 1150 594 M 1164 594 L 1164 580" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Content -->
  <g transform="translate(84, 96)">
    <!-- Pill Tag -->
    <g>
      <rect x="0" y="0" width="386" height="32" rx="16" fill="#18181b" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="16" r="4" fill="#f59e0b"/>
      <text x="30" y="21" font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="700" fill="#fef08a" letter-spacing="2.2">
        PRIVATE CHAMBERS &amp; VAULT BUYOUTS
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="112" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-size="56" font-weight="700" fill="url(#goldGradient)" letter-spacing="2">
      PRIVATE DINING &amp; GALAS
    </text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#e2e8f0" letter-spacing="0.5">
      Discreet Executive Chambers &amp; Sommelier Salon
    </text>

    <!-- Detail Description -->
    <text x="0" y="196" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Bespoke Multi-Course Menus · Dedicated Maître d’ · Up to 60 Esteemed Guests
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 246)">
      
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="206" height="42" rx="8" fill="#14171f" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
            <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#fef08a">
              Executive Buyouts
            </text>
          </g>
          <g transform="translate(218, 0)">
            <rect x="0" y="0" width="196" height="42" rx="8" fill="#14171f" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
            <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
              Sommelier Cellar
            </text>
          </g>
          <g transform="translate(426, 0)">
            <rect x="0" y="0" width="226" height="42" rx="8" fill="#14171f" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
            <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
              Bespoke Degustation
            </text>
          </g>
    </g>

    <!-- Footer Note -->
    <g transform="translate(0, 360)">
      <line x1="0" y1="0" x2="560" y2="0" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#d4af37">
        Pier 7, The Embarcadero, San Francisco, CA
      </text>
      <text x="360" y="32" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">
        THE EMBER TABLE
      </text>
    </g>
  </g>

  <!-- Right Visual Motif -->
  <g transform="translate(930, 290)">
    
          <circle cx="0" cy="0" r="140" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.5"/>
          <circle cx="0" cy="0" r="170" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2"/>
          <circle cx="0" cy="-45" r="32" fill="none" stroke="url(#goldGradient)" stroke-width="7"/>
          <circle cx="0" cy="-45" r="16" fill="none" stroke="#fef08a" stroke-width="2"/>
          <rect x="-4" y="-15" width="8" height="90" fill="url(#goldGradient)"/>
          <rect x="4" y="45" width="22" height="8" fill="url(#goldGradient)"/>
          <rect x="4" y="62" width="16" height="8" fill="url(#goldGradient)"/>
          <text x="0" y="130" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#fef08a" letter-spacing="3">EXCLUSIVE VAULT BUYOUTS</text>
        
    <!-- Floating Embers / Sparks -->
    <circle cx="-110" cy="-60" r="3.5" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="-70" cy="-110" r="4.5" fill="#f97316" filter="url(#glow)"/>
    <circle cx="40" cy="-120" r="3" fill="#eab308" filter="url(#glow)"/>
    <circle cx="95" cy="-80" r="5" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="120" cy="-30" r="3.5" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="-130" cy="20" r="4" fill="#f97316" filter="url(#glow)"/>
    <circle cx="130" cy="30" r="3" fill="#fbbf24" filter="url(#glow)"/>
  </g>
</svg>